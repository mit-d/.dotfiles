# macOS
#
# Intentionally empty. Dotfiles on macOS are managed by home-manager, not stow:
# see nix/home/ and run `sudo darwin-rebuild switch --flake ~/.dotfiles`.
#
# The stow package directories (bash/, fish/, zsh/, ...) still exist and are
# still used by the Arch machine via flavors/arch.conf. They stay until that
# machine is replaced by NixOS.
#
# `make stow` will refuse to run with an empty package list rather than failing
# obscurely -- see the guard in the Makefile.
